name: Build and publish Invobuk installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build app and installer
        run: npm run electron:build

      - name: Find installer file
        id: find_installer
        shell: bash
        run: |
          FILE=$(find dist-electron -maxdepth 1 -iname "*.exe" | head -n 1)
          echo "Found installer: $FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload installer to Supabase Storage
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS -X POST \
            "https://mqsqfbvoupzxqmbyxugd.supabase.co/storage/v1/object/downloads/Invobuk-Setup.exe" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.microsoft.portable-executable" \
            -H "x-upsert: true" \
            --data-binary "@${{ steps.find_installer.outputs.path }}" \
            --fail

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: invobuk-installer
          path: ${{ steps.find_installer.outputs.path }}
